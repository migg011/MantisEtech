name: projeto-mantis

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BD_NOME}
      POSTGRES_USER: ${BD_USUARIO}
      POSTGRES_PASSWORD: ${BD_SENHA}
    ports:
      - '127.0.0.1:${BD_PORT:-5433}:5432'
    volumes:
      - mantis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${BD_USUARIO} -d ${BD_NOME}']
      interval: 5s
      retries: 10

volumes:
  mantis_pgdata: