services:
  - type: web
    name: mantisetech-demo
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile.demo
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mantisetech-demo-db
          property: connectionString
      - key: MANTIS_DEMO_SEED
        value: "true"
      - key: MANTIS_DEMO_ADMIN_PASSWORD
        sync: false

databases:
  - name: mantisetech-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []
