<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 605" role="img" aria-labelledby="historico-titulo historico-descricao"><title id="historico-titulo">Acesso e histórico</title><desc id="historico-descricao">Usuários identificam os responsáveis. Anexos pertencem ao equipamento; movimentações preservam de onde a máquina saiu e para onde foi.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="1320" height="605" fill="#f4f7fb"/><g data-rel="R49"><title>Cada registro de Usuários aponta para zero ou um registro de Linhas de produção. Cada registro de Linhas de produção pode ser referenciado por zero, um ou vários registros de Usuários. Coluna: linha_id.</title><path class="ligacao" d="M 215,365 L 215,234"/><text class="numero" text-anchor="middle" x="231" y="351">0..1</text><text class="numero" text-anchor="middle" x="231" y="257">0..N</text><text class="referencia" text-anchor="middle" x="215.0" y="289.5">R49</text></g><g data-rel="R03"><title>Cada registro de Fotos e manuais aponta para exatamente um registro de Equipamentos. Cada registro de Equipamentos pode ser referenciado por zero, um ou vários registros de Fotos e manuais. Coluna: equipamento_id.</title><path class="ligacao" d="M 660,234 L 660,365"/><text class="numero" text-anchor="middle" x="676" y="256">1</text><text class="numero" text-anchor="middle" x="676" y="352">0..N</text><text class="referencia" text-anchor="middle" x="660.0" y="289.5">R03</text></g><g data-rel="R22"><title>Cada registro de Movimentações aponta para exatamente um registro de Equipamentos. Cada registro de Equipamentos pode ser referenciado por zero, um ou vários registros de Movimentações. Coluna: equipamento_id.</title><path class="ligacao" d="M 820,142 L 945,142"/><text class="numero" text-anchor="middle" x="842" y="131">1</text><text class="numero" text-anchor="middle" x="918" y="131">0..N</text><text class="referencia" text-anchor="middle" x="882.5" y="132.0">R22</text></g><g data-tabela="usuarios"><rect class="card" x="55" y="50" width="320" height="184" rx="10"/><path d="M65,50 H365" stroke="#53677e" stroke-width="4"/><text x="71" y="77" font-size="17" font-weight="650">Usuários</text><text class="fisico" x="71" y="115" font-size="11" fill="#66778d">usuarios</text><text x="71" y="144" font-size="12"><title>id</title><tspan fill="#53677e" font-weight="700">PK     </tspan> Identificador</text><text x="71" y="166" font-size="12"><title>linha_id</title><tspan fill="#53677e" font-weight="700">FK     </tspan> Linha vinculada</text><text x="71" y="188" font-size="12"><title>nome</title><tspan fill="#53677e" font-weight="700">       </tspan> Nome</text></g><g data-tabela="equipamentos"><rect class="card" x="500" y="50" width="320" height="184" rx="10"/><path d="M510,50 H810" stroke="#53677e" stroke-width="4"/><text x="516" y="77" font-size="17" font-weight="650">Equipamentos</text><text class="fisico" x="516" y="115" font-size="11" fill="#66778d">equipamentos</text><text x="516" y="144" font-size="12"><title>id</title><tspan fill="#53677e" font-weight="700">PK     </tspan> Identificador</text><text x="516" y="166" font-size="12"><title>nome</title><tspan fill="#53677e" font-weight="700">       </tspan> Nome</text><text x="516" y="188" font-size="12"><title>numero_serie</title><tspan fill="#53677e" font-weight="700">       </tspan> Número de série</text></g><g data-tabela="movimentacoes_equipamento"><rect class="card" x="945" y="50" width="320" height="184" rx="10"/><path d="M955