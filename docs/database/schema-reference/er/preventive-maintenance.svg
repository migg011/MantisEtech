<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 605" role="img" aria-labelledby="preventivas-titulo preventivas-descricao"><title id="preventivas-titulo">Manutenção preventiva</title><desc id="preventivas-descricao">O roteiro pertence ao tipo de equipamento. A agenda pertence à máquina. A OS preserva o que foi emitido; a execução registra o que foi concluído.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="1320" height="605" fill="#f4f7fb"/><g data-rel="R11"><title>Cada registro de Equipamentos aponta para exatamente um registro de Tipos de equipamento. Cada registro de Tipos de equipamento pode ser referenciado por zero, um ou vários registros de Equipamentos. Coluna: tipo_equipamento_id.</title><path class="ligacao" d="M 375,142 L 500,142"/><text class="numero" text-anchor="middle" x="397" y="131">1</text><text class="numero" text-anchor="middle" x="473" y="131">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="132.0">R11</text></g><g data-rel="R39"><title>Cada registro de Roteiros de preventiva aponta para exatamente um registro de Tipos de equipamento. Cada registro de Tipos de equipamento pode ser referenciado por zero, um ou vários registros de Roteiros de preventiva. Coluna: tipo_equipamento_id.</title><path class="ligacao" d="M 215,234 L 215,365"/><text class="numero" text-anchor="middle" x="231" y="256">1</text><text class="numero" text-anchor="middle" x="231" y="352">0..N</text><text class="referencia" text-anchor="middle" x="215.0" y="289.5">R39</text></g><g data-rel="R01"><title>Cada registro de Programação preventiva aponta para exatamente um registro de Equipamentos. Cada registro de Equipamentos pode ser referenciado por zero, um ou vários registros de Programação preventiva. Coluna: equipamento_id.</title><path class="ligacao" d="M 820,142 L 945,142"/><text class="numero" text-anchor="middle" x="842" y="131">1</text><text class="numero" text-anchor="middle" x="918" y="131">0..N</text><text class="referencia" text-anchor="middle" x="882.5" y="132.0">R01</text></g><g data-rel="R26"><title>Cada registro de OS preventivas aponta para exatamente um registro de Programação preventiva. Cada registro de Programação preventiva pode ser referenciado por zero, um ou vários registros de OS preventivas. Coluna: agenda_id.</title><path class="ligacao" d="M 1025,234 L 1025,299.5 L 580,299.5 L 580,365"/><text class="numero" text-anchor="middle" x="1041" y="256">1</text><text class="numero" text-anchor="middle" x="596" y="352">0..N</text><text class="referencia" text-anchor="middle" x="580" y="289.5">R26</text></g><g data-rel="R14"><title>Cada registro de Execuções preventivas aponta para exatamente um registro de Programação preventiva. Cada registro de Programação preventiva pode ser referenciado por zero, um ou vários registros de Execuções preventivas. Coluna: agenda_id.</title><path class="ligacao" d="M 1105,234 L 1105,365"/><text class="numero" text-anchor="middle" x="1121" y="256">1</text><text class="numero" text-anchor="middle" x="1121" y="352">0..N</text><text class="referencia" text-anchor="middle" x="1105.0" y="289.5">R14</text></g><g data-rel="R15"><title>Cada registro de Execuções preventivas aponta para zero ou um registro de OS preventivas. Cada registro de OS preventivas pode ser referenciado por zero ou um registro de Execuções preventivas. Coluna: ordem_preventiva_id.</title><path class="ligacao" d="M 820,457 L 945,457"/><text class="numero" text-anchor="middle" x="842" y="446">0..1</text><text class="numero" text-anchor="middle" x="918" y="446">0..1</text><text class="referencia" text-anchor="middle" x="882.5" y="447.0">R15</text></g><g data-tabela="tipos_equipamento"><rect class="card" x="55" y="50" width="320" height="184" rx="10"/><path d="M65,50 H365" stroke="#6655a2" stroke-width="4"/><text x="71" y="77" font-size="17" font-weight="650">Tipos de equipamento</text><text class="fisico" x="71" y="115" font-size="11" fill="#66778d">tipos_equipamento</text><text x="71" y="144" font-size="12"><title>id</title><tspan fill="#6655a2" font-weight="700">PK     </tspan> Identificador</text><text x="71" y="166" font-size="12"><title>nome</title><tspan fill="#6655a2" font-weight="700">       </tspan> Nome</text></g><g data-tabela="equipamentos"><rect class="card" x="500" y="50" width="320" height="184" rx="10"/><path d="M510,50 H810" stroke="#6655a2" stroke-width="4"/><text x="516" y="77" font-size="17" font-weight="650">Equipamentos</text><text class="fisico" x="516" y="115" font-size="11" fill="#66778d">equipamentos</text><text x="516" y="144" font-size="12"><title>id</title><tspan fill="#6655a2" font-weight="700">PK     </tspan> Identificador</text><text x="516" y="166" font-size="12"><title>tipo_equipamento_id</title><tspan fill="#6655a2" font-weight="700">FK     </tspan> Tipo de equipamento</text><text x="516" y="188" font-size="12"><title>nome</title><tspan fill="#6655a2" font-weight="700">       </tspan> Nome</text><text x="516" y="210" font-size="12"><title>numero_serie</title><tspan fill="#6655a2" font-weight="700">       </tspan> Número de série</text></g><g data-tabela="agendas_preventiva"><rect class="card" x="945" y="50" width="320" height="184" rx="10"/><path d="M955,50 H1255" stroke="#6655a2" stroke-width="4"/><text x="961" y="77" font-size="17" font-weight="650">Programação preventiva</text><text class="fisico" x="961" y="115" font-size="11" fill="#66778d">agendas_preventiva</text><text x="961" y="144" font-size="12"