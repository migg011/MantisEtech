<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 605" role="img" aria-labelledby="infraestrutura-titulo infraestrutura-descricao"><title id="infraestrutura-titulo">Tabelas internas — 5</title><desc id="infraestrutura-descricao">Estas cinco entidades são mantidas pelo Django. Seus nomes físicos continuam originais, mas os títulos abaixo explicam a função em português. Não substituem os perfis Administrador, Técnico e Operador do MANTIS.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="1320" height="605" fill="#f4f7fb"/><g data-rel="R04"><title>Cada registro de Permissões dos grupos aponta para exatamente um registro de Permissões do Django. Cada registro de Permissões do Django pode ser referenciado por zero, um ou vários registros de Permissões dos grupos. Coluna: permission_id.</title><path class="ligacao" d="M 945,142 L 820,142"/><text class="numero" text-anchor="middle" x="923" y="131">1</text><text class="numero" text-anchor="middle" x="847" y="131">0..N</text><text class="referencia" text-anchor="middle" x="882.5" y="132.0">R04</text></g><g data-rel="R05"><title>Cada registro de Permissões dos grupos aponta para exatamente um registro de Grupos de permissões. Cada registro de Grupos de permissões pode ser referenciado por zero, um ou vários registros de Permissões dos grupos. Coluna: group_id.</title><path class="ligacao" d="M 375,142 L 500,142"/><text class="numero" text-anchor="middle" x="397" y="131">1</text><text class="numero" text-anchor="middle" x="473" y="131">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="132.0">R05</text></g><g data-rel="R06"><title>Cada registro de Permissões do Django aponta para exatamente um registro de Tipos de registro do Django. Cada registro de Tipos de registro do Django pode ser referenciado por zero, um ou vários registros de Permissões do Django. Coluna: content_type_id.</title><path class="ligacao" d="M 1105,365 L 1105,234"/><text class="numero" text-anchor="middle" x="1121" y="351">1</text><text class="numero" text-anchor="middle" x="1121" y="257">0..N</text><text class="referencia" text-anchor="middle" x="1105.0" y="289.5">R06</text></g><g data-tabela="auth_group"><rect class="card" x="55" y="50" width="320" height="184" rx="10"/><path d="M65,50 H365" stroke="#53677e" stroke-width="4"/><text x="71" y="77" font-size="17" font-weight="650">Grupos de permissões</text><text class="fisico" x="71" y="115" font-size="11" fill="#66778d">auth_group</text><text x="71" y="144" font-size="12"><title>id</title><tspan fill="#53677e" font-weight="700">PK     </tspan> Identificador</text><text x="71" y="166" font-size="12"><title>name</title><tspan fill="#53677e" font-weight="700">       </tspan> Nome</text></g><g data-tabela="auth_group_permissions"><rect class="card" x="500" y="50" width="320" height="184" rx="10"/><path d="M510,50 H810" stroke="#53677e" stroke-width="4"/><text x="516" y="77" font-size="17" font-weight="650">Permissões dos grupos</text><text class="fisico" x="516" y="115" font-size="11" fill="#66778d">auth_group_permissions</text><text x="516" y="144" font-size="12"><title>id</title><tspan fill="#53677e" font-weight="700">PK     </tspan> Identificador</text><text x="516" y="166" font-size="12"><title>permission_id</title><tspan fill="#53677e" font-weight="700">FK     </tspan> Permissão vinculada</text><text x="516" y="188" font-size="12"><title>group_id</title><tspan fill="#53677e" font-weight="700">FK     </tspan> Grupo vinculado</text></g><g data-tabela="auth_permission"><rect class="card" x="945" y="50" width="320" height="184" rx="10"/><path d="M955,50 H1255" stroke="#53677e" stroke-width="4"/><text x="961" y="77" font-size="17" font-weight="650">Permissões do Django</text><text class="fisico" x="961" y="115" font-size="11" fill="#66778d">auth_permission</text><text x="961" y="144" font-size="12"><title>id</title><tspan fill="#53677e" font-weight="700">PK     </tspan> Identificador</text><text x="961" y="166" font-size="12"><title>content_type_id</title><tspan fill="#53677e" font-weight="700">FK     </tspan> Tipo de registro vinculado</text><text x="961" y="188" font-size="12"><title>name</title><tspan fill="#53677e" font-weight="700">       </tspan> Nome</text><text x="961" y="210" font-size="12"><title>codename</title><tspan fill="#53677e" font-weight="700">       </tspan> Código da permissão</text></g><g data-tabela="django_content_type"><rect class="card" x="945" y="365" width="320" height="184" rx="10"/><path d="M955,365 H1255" stroke="#53677e" stroke-width="4"/><text x="961" y="392" font-size="17" font-weight="650">Tipos de registro do Django</text><text class="fisico" x="961" y="430" font-size="11" fill="#66778d">django_content_type</text><text x="961" y="459" font-size="12"><title>id</title><tspan fill="#53677e" font-weight="700">PK     </tspan> Identificador</text><text x="961" y="481" font-size="12"><title>app_label</title><tspan fill="#53677e" font-weight="700">       </tspan> Aplicação responsável</text><text x="961" y="503" font-size="12"><title>model</title><tspan fill="#53677e" font-weight="700">       </tspan> Modelo registrado</text></g><g data-tabela="django_migrations"><rect class="card" x="55" y="365" width="320" height="184" rx="10"/><path d="M65,365 H365" stroke="#53677e" stroke-width="4"/><text x="71" y="392" font-size="17" font-weight="650">Histórico de migrações</text><text class="fisico" x="71" y="430" font-size="11" fill="#66778d">django_migrations</text><text x