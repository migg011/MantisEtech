<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 875 605" role="img" aria-labelledby="estrutura-titulo estrutura-descricao"><title id="estrutura-titulo">Estrutura industrial</title><desc id="estrutura-descricao">Primeiro cadastre o setor e o tipo; depois, o equipamento. A linha organiza a alocação atual da máquina.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="875" height="605" fill="#f4f7fb"/><g data-rel="R21"><title>Cada registro de Linhas de produção aponta para zero ou um registro de Setores. Cada registro de Setores pode ser referenciado por zero, um ou vários registros de Linhas de produção. Coluna: setor_id.</title><path class="ligacao" d="M 375,142 L 500,142"/><text class="numero" text-anchor="middle" x="397" y="131">0..1</text><text class="numero" text-anchor="middle" x="473" y="131">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="132.0">R21</text></g><g data-rel="R09"><title>Cada registro de Equipamentos aponta para zero ou um registro de Linhas de produção. Cada registro de Linhas de produção pode ser referenciado por zero, um ou vários registros de Equipamentos. Coluna: linha_id.</title><path class="ligacao" d="M 660,234 L 660,365"/><text class="numero" text-anchor="middle" x="676" y="256">0..1</text><text class="numero" text-anchor="middle" x="676" y="352">0..N</text><text class="referencia" text-anchor="middle" x="660.0" y="289.5">R09</text></g><g data-rel="R11"><title>Cada registro de Equipamentos aponta para exatamente um registro de Tipos de equipamento. Cada registro de Tipos de equipamento pode ser referenciado por zero, um ou vários registros de Equipamentos. Coluna: tipo_equipamento_id.</title><path class="ligacao" d="M 375,457 L 500,457"/><text class="numero" text-anchor="middle" x="397" y="446">1</text><text class="numero" text-anchor="middle" x="473" y="446">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="447.0">R11</text></g><g data-rel="R10"><title>Cada registro de Equipamentos aponta para zero ou um registro de Setores. Cada registro de Setores pode ser referenciado por zero, um ou vários registros de Equipamentos. Coluna: setor_id.</title><path class="ligacao" d="M 135,234 L 135,299.5 L 580,299.5 L 580,365"/><text class="numero" text-anchor="middle" x="151" y="256">0..1</text><text class="numero" text-anchor="middle" x="596" y="352">0..N</text><text class="referencia" text-anchor="middle" x="580" y="289.5">R10</text></g><g data-tabela="setores"><rect class="card" x="55" y="50" width="320" height="184" rx="10"/><path d="M65,50 H365" stroke="#176b76" stroke-width="4"/><text x="71" y="77" font-size="17" font-weight="650">Setores</text><text class="fisico" x="71" y="115" font-size="11" fill="#66778d">setores</text><text x="71" y="144" font-size="12"><title>id</title><tspan fill="#176b76" font-weight="700">PK     </tspan> Identificador</text><text x="71" y="166" font-size="12"><title>nome</title><tspan fill="#176b76" font-weight="700">       </tspan> Nome</text><text x="71" y="188" font-size="12"><title>codigo</title><tspan fill="#176b76" font-weight="700">       </tspan> Código</text></g><g data-tabela="linhas"><rect class="card" x="500" y="50" width="320" height="184" rx="10"/><path d="M510,50 H810" stroke="#176b76" stroke-width="4"/><text x="516" y="77" font-size="17" font-weight="650">Linhas de produção</text><text class="fisico" x="516" y="115" font-size="11" fill="#66778d">linhas</text><text x="516" y="144" font-size="12"><title>id</