<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 920" role="img" aria-labelledby="visao-geral-titulo visao-geral-descricao"><title id="visao-geral-titulo">Comece por aqui</title><desc id="visao-geral-descricao">O equipamento é o ponto central. A preventiva segue uma programação; a corretiva nasce de um problema. São ordens em tabelas diferentes.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="1320" height="920" fill="#f4f7fb"/><g data-rel="R21"><title>Cada registro de Linhas de produção aponta para zero ou um registro de Setores. Cada registro de Setores pode ser referenciado por zero, um ou vários registros de Linhas de produção. Coluna: setor_id.</title><path class="ligacao" d="M 375,142 L 500,142"/><text class="numero" text-anchor="middle" x="397" y="131">0..1</text><text class="numero" text-anchor="middle" x="473" y="131">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="132.0">R21</text></g><g data-rel="R09"><title>Cada registro de Equipamentos aponta para zero ou um registro de Linhas de produção. Cada registro de Linhas de produção pode ser referenciado por zero, um ou vários registros de Equipamentos. Coluna: linha_id.</title><path class="ligacao" d="M 660,234 L 660,365"/><text class="numero" text-anchor="middle" x="676" y="256">0..1</text><text class="numero" text-anchor="middle" x="676" y="352">0..N</text><text class="referencia" text-anchor="middle" x="660.0" y="289.5">R09</text></g><g data-rel="R11"><title>Cada registro de Equipamentos aponta para exatamente um registro de Tipos de equipamento. Cada registro de Tipos de equipamento pode ser referenciado por zero, um ou vários registros de Equipamentos. Coluna: tipo_equipamento_id.</title><path class="ligacao" d="M 375,457 L 500,457"/><text class="numero" text-anchor="middle" x="397" y="446">1</text><text class="numero" text-anchor="middle" x="473" y="446">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="447.0">R11</text></g><g data-rel="R01"><title>Cada registro de Programação preventiva aponta para exatamente um registro de Equipamentos. Cada registro de Equipamentos pode ser referenciado por zero, um ou vários registros de Programação preventiva. Coluna: equipamento_id.</title><path class="ligacao" d="M 820,457 L 945,457"/><text class="numero" text-anchor="middle" x="842" y="446">1</text><text class="numero" text-anchor="middle" x="918" y="446">0..N</text><text class="referencia" text-anchor="middle" x="882.5" y="447.0">R01</text></g><g data-rel="R31"><title>Cada registro de OS corretivas aponta para exatamente um registro de Equipamentos. Cada registro de Equipamentos pode ser referenciado por zero, um ou vários registros de OS corretivas. Coluna: equipamento_id.</title><path class="ligacao" d="M 660,549 L 660,680"/><text class="numero" text-anchor="middle" x="676" y="571">1</text><text class="numero" text-anchor="middle" x="676" y="667">0..N</text><text class="referencia" text-anchor="middle" x="660.0" y="604.5">R31</text></g><g data-rel="R26"><title>Cada registro de OS preventivas aponta para exatamente um registro de Programação preventiva. Cada registro de Programação preventiva pode ser referenciado por zero, um ou vários registros de OS preventivas. Coluna: agenda_id.</title><path class="ligacao" d="M 1105,549 L 1105,680"/><text class="numero" text-anchor="middle" x="1121" y="571">1</text><text class="numero" text-anchor="middle" x="1121" y="667">0..N</text><text class="referencia" text-anch