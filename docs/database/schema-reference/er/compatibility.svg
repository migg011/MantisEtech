<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 290" role="img" aria-labelledby="compatibilidade-titulo compatibilidade-descricao"><title id="compatibilidade-titulo">Compatibilidade existente</title><desc id="compatibilidade-descricao">Esta associação já existe no esquema, mas não é exigida nem gravada pela aba Spare Parts da preventiva.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="1320" height="290" fill="#f4f7fb"/><g data-rel="R07"><title>Cada registro de Compatibilidade antiga aponta para exatamente um registro de Equipamentos. Cada registro de Equipamentos pode ser referenciado por zero, um ou vários registros de Compatibilidade antiga. Coluna: equipamento_id.</title><path class="ligacao" d="M 375,142 L 500,142"/><text class="numero" text-anchor="middle" x="397" y="131">1</text><text class="numero" text-anchor="middle" x="473" y="131">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="132.0">R07</text></g><g data-rel="R08"><title>Cada registro de Compatibilidade antiga aponta para exatamente um registro de Catálogo de peças. Cada registro de Catálogo de peças pode ser referenciado por zero, um ou vários registros de Compatibilidade antiga. Coluna: peca_id.</title><path class="ligacao" d="M 945,142 L 820,142"/><text class="numero" text-anchor="middle" x="923" y="131">1</text><text class="numero" text-anchor="middle" x="847" y="131">0..N</text><text class="referencia" text-anchor="middle" x="882.5" y="132.0">R08</text></g><g data-tabela="equipamentos"><rect class="card" x="55" y="50" width="320" height="184" rx="10"/><path d="M65,50 H365" stroke="#6b7280" stroke-width="4"/><text x="71" y="77" font-size="17" font-weight="650">Equipamentos</text><text class="fisico" x="71" y="115" font-size="11" fill="#66778d">equipamentos</text><text x="71" y="144" font-size="12"><title>id</title><tspan fill="#6b7280" font-weight="700">PK     </tspan> Identificador</text><text x="71" y="166" font-size="12"><title>nome</title><tspan fill="#6b7280" font-weight="700">       </tspan> Nome</text><text x="71" y="188" font-size="12"><title>numero_serie</title><tspan fill="#6b7280" font-weight="700">       </tspan> Número de série</text></g><g data-tabela="compatibilidade_pecas_equipamentos"><rect class="card" x="500" y="50" width="320" height="184" rx="10"/><path d="M510,50 H810" stroke="#6b7280" stroke-width="4"/><text x="516" y="77" font-size="17" font-weight="650">Compatibilidade antiga</text><text class="fisico" x="516" y="115" font-size="11" fill="#66778d">compatibilidade_pecas_equipamentos</text><text x="516" y="144" font-size="12"><title>peca_id</title><tspan fill="#6b7280" font-weight="700">PK / FK</tspan> Peça vinculada</text><text x="516" y="166" font-size="12"><title>equipamento_id</title><tspan fill="#6b7280" font-weight="700">PK / FK</tspan> Equipamento vinculado</text></g><g data-tabela="pecas_reposicao"><rect class="card" x="945" y="50" width="320" height="184" rx="10"/><path d="M955,50 H1255" stroke="#6b7280" stroke-width="4"/><text x="961" y="77" font-size="17" font-weight="650">Catálogo de peças</text><text class="fisico" x="961" y="115" font-size="11" fill="#66778d">pecas_reposicao</text><text x="961" y="144" font-size="12"><title>id</title><tspan fill="#6b7280" font-weight="700">PK     </tspan> Identificador</text><text x="961" y="166" font-size="12"><title>codigo</title><tspan fill="#6b7280" font-weight="700">       </tspan> Código</text></g></svg>