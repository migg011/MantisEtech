dor</text><text x="71" y="166" font-size="12"><title>nome</title><tspan fill="#a45a12" font-weight="700">       </tspan> Nome</text><text x="71" y="188" font-size="12"><title>numero_serie</title><tspan fill="#a45a12" font-weight="700">       </tspan> Número de série</text></g><g data-tabela="ordens_servico"><rect class="card" x="500" y="50" width="320" height="184" rx="10"/><path d="M510,50 H810" stroke="#a45a12" stroke-width="4"/><text x="516" y="77" font-size="17" font-weight="650">OS corretivas</text><text class="fisico" x="516" y="115" font-size="11" fill="#66778d">ordens_servico</text><text x="516" y="144" font-size="12"><title>id</title><tspan fill="#a45a12" font-weight="700">PK     </tspan> Identificador</text><text x="516" y="166" font-size="12"><title>equipamento_id</title><tspan fill="#a45a12" font-weight="700">FK     </tspan> Equipamento vinculado</text><text x="516" y="188" font-size="12"><title>tipo_problema_id</title><tspan fill="#a45a12" font-weight="700">FK     </tspan> Tipo de problema</text><text x="516" y="210" font-size="12"><title>situacao</title><tspan fill="#a45a12" font-weight="700">       </tspan> Situação</text></g><g data-tabela="pendencias_linha"><rect class="card" x="945" y="50" width="320" height="184" rx="10"/><path d="M955,50 H1255" stroke="#a45a12" stroke-width="4"/><text x="961" y="77" font-size="17" font-weight="650">Pendências da linha</text><text class="fisico" x="961" y="115" font-size="11" fill="#66778d">pendencias_linha</text><text x="961" y="144" font-size="12"><title>id</title><tspan fill="#a45a12" font-weight="700">PK     </tspan> Identificador</text><text x="961" y="166" font-size="12"><title>ordem_servico_id</title><tspan fill="#a45a12" font-weight="700">FK     </tspan> Ordem corretiva vinculada</text><text x="961" y="188" font-size="12"><title>situacao</title><tspan fill="#a45a12" font-weight="700">       </tspan> Situação</text></g><g data-tabela="tipos_problema"><rect class="card" x="55" y="365" width="320" height="184