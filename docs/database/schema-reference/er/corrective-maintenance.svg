<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 605" role="img" aria-labelledby="corretivas-titulo corretivas-descricao"><title id="corretivas-titulo">Manutenção corretiva</title><desc id="corretivas-descricao">A OS registra a falha da máquina. Ela pode gerar pendências e solicitações diretas de peças, sem criar uma compra automaticamente.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="1320" height="605" fill="#f4f7fb"/><g data-rel="R31"><title>Cada registro de OS corretivas aponta para exatamente um registro de Equipamentos. Cada registro de Equipamentos pode ser referenciado por zero, um ou vários registros de OS corretivas. Coluna: equipamento_id.</title><path class="ligacao" d="M 375,142 L 500,142"/><text class="numero" text-anchor="middle" x="397" y="131">1</text><text class="numero" text-anchor="middle" x="473" y="131">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="132.0">R31</text></g><g data-rel="R33"><title>Cada registro de OS corretivas aponta para zero ou um registro de Tipos de problema. Cada registro de Tipos de problema pode ser referenciado por zero, um ou vários registros de OS corretivas. Coluna: tipo_problema_id.</title><path class="ligacao" d="M 135,365 L 135,299.5 L 580,299.5 L 580,234"/><text class="numero" text-anchor="middle" x="151" y="351">0..1</text><text class="numero" text-anchor="middle" x="596" y="257">0..N</text><text class="referencia" text-anchor="middle" x="580" y="289.5">R33</text><