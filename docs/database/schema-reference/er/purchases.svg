<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 920" role="img" aria-labelledby="compras-titulo compras-descricao"><title id="compras-titulo">Peças e compras</title><desc id="compras-descricao">As peças ficam em um catálogo geral. A compra reúne itens; cada item escolhe uma peça e informa a quantidade.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192c43}.fisico,.campo{font-family:Consolas,monospace}.ligacao{stroke:#71849b;stroke-width:2;fill:none}.card{fill:white;stroke:#cbd5e1;stroke-width:1.5}.numero{font-size:13px;font-weight:700;paint-order:stroke;stroke:#f4f7fb;stroke-width:6;stroke-linejoin:round}.referencia{font-size:12px;font-weight:700;fill:#415876;paint-order:stroke;stroke:#f4f7fb;stroke-width:7}.selecionado .ligacao{stroke:#ba1735;stroke-width:4}.selecionado text{fill:#ba1735}.foco .card{stroke:#ba1735;stroke-width:3}</style><rect width="1320" height="920" fill="#f4f7fb"/><g data-rel="R43"><title>Cada registro de Solicitações de compra aponta para exatamente um registro de Usuários. Cada registro de Usuários pode ser referenciado por zero, um ou vários registros de Solicitações de compra. Coluna: solicitante_id.</title><path class="ligacao" d="M 375,142 L 500,142"/><text class="numero" text-anchor="middle" x="397" y="131">1</text><text class="numero" text-anchor="middle" x="473" y="131">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="132.0">R43</text></g><g data-rel="R19"><title>Cada registro de Itens da compra aponta para exatamente um registro de Solicitações de compra. Cada registro de Solicitações de compra pode ser referenciado por zero, um ou vários registros de Itens da compra. Coluna: solicitacao_id.</title><path class="ligacao" d="M 660,234 L 660,365"/><text class="numero" text-anchor="middle" x="676" y="256">1</text><text class="numero" text-anchor="middle" x="676" y="352">0..N</text><text class="referencia" text-anchor="middle" x="660.0" y="289.5">R19</text></g><g data-rel="R20"><title>Cada registro de Itens da compra aponta para exatamente um registro de Catálogo de peças. Cada registro de Catálogo de peças pode ser referenciado por zero, um ou vários registros de Itens da compra. Coluna: peca_id.</title><path class="ligacao" d="M 375,457 L 500,457"/><text class="numero" text-anchor="middle" x="397" y="446">1</text><text class="numero" text-anchor="middle" x="473" y="446">0..N</text><text class="referencia" text-anchor="middle" x="437.5" y="447.0">R20</text></g><g data-rel="R12"><title>Cada registro de Histórico da compra aponta para exatamente um registro de Solicitações de compra. Cada registro de Solicitações de compra pode ser referenciado por zero, um ou vários registros de Histórico da compra. Coluna: solicitacao_id.</title><path class="ligacao" d="M 820,142 L 945,142"/><text class="numero" text-anchor="middle" x="842" y="131">1</text><text class="numero" text-anchor="middle" x="918" y="131">0..N</text><text class="referencia" text-anchor="middle" x="882.5" y="132.0">R12</text></g><g data-rel="R17"><title>Cada registro de Fichas técnicas das peças aponta para exatamente um registro de Catálogo de peças. Cada registro de Catálogo de peças pode ser referenciado por zero ou um registro de Fichas técnicas das peças. Coluna: peca_id.</title><path class="ligacao" d="M 215,549 L 215,680"/><text class="numero" text-anchor="middle" x="231" y="571">1</text><text class="numero" text-anchor="middle" x="231" y="667">0..1</text><text class="referencia" text-anchor="middle" x="215.0" y="604.5">R17</text></g><g data-tabela="usuarios"><rect class="card" x="55" y="50" width="320" height="184" rx="10"/><path d="M65,50 H365" stroke="#2454a3" stroke-width="4"/><text x="71" y="77" font-size="17" font-weight="650">Usuários</text><text class="fisico" x="71" y="115" font-size="11" fill="#66778d">usuarios</text><text x="71" y="144" font-size="12"><title>id</title><tspan fill="#2454a3" font-weight="700">PK     </tspan> Identificador</text><text x="71" y="166" font-size="12"><title>nome</title><tspan fill="#2454a3" font-weight="700">       </tspan> Nome</text></g><g data-tabela="solicitacoes_compra"><rect class="card" x="500" y="50" width="320" height="184" rx="10"/><path d="M510,50 H810" stroke="#2454a3" stroke-width="4"/><text x="516" y="77" font-size="17" font-weight="650">Solicitações de compra</text><text class="fisico" x="516" y="115" font-size="11" fill="#66778d">solicitacoes_compra</text><text x="516" y="144" font-size="12"><title>id</title><tspan fill="#2454a3" font-weight="700">PK     </tspan> Identificador</text><text x="516" y="166" font-size="12"><title>solicitante_id</title><tspan fill="#2454a3" font-weight="700">FK     </tspan> Usuário solicitante</text><text x="516" y="188" font-size="12"><title>situacao</title><tspan fill="#2454a3" font-weight="700">       </tspan> Situação</text></g><g data-tabela="eventos_solicitacao_compra"><rect class="card" x="945" y="50" width="320" height="184" rx="10"/><path d="M955,50 H1255" stroke="#2454a3" stroke-width="4"/><text x="961" y="77" font-size="17" font-weight="650">Histórico da compra</text><text class="fisico" x="961" y="115" font-size="11" fill="#66778d">eventos_solicitacao_compra</text><text x="961" y="144" font-size="12"><title>id</title><tspan fill="#2454a3" font-weight="700">PK     </tspan> Identificador</text><text x="961" y="166" font-size="12"><title>solicitacao_id</title><tspan fill="#2454a3" font-weight="700">FK     </tspan> Compra vinculada</text></g><g data-tabela="pecas_reposicao"><rect class="card" x="55" y="365" width="320" height="184" rx="10"/><path d="M65,365 H365" stroke="#2454a3" stroke-width="4"/><text x="71" y="392" font-size="17" font-weight="650">Catálogo de peças</text><text class="fisico" x="71" y="430" font-size="11" fill="#66778d">pecas_reposicao</text><text x="71" y="459" font-size="12"><title>id</title><tspan fill="#2454a3" font-weight="700">PK     </tspan> Identificador</text><text x="71" y="481" font-size="12"><title>codigo</title><tspan fill="#2454a